name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button in the Actions tab

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Server starts and answers
        run: |
          DB_PATH=/tmp/ci.db PORT=3001 node --disable-warning=ExperimentalWarning server/index.js &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3001/api/auth/me && exit 0; sleep 1; done
          exit 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          # The server key is restricted to /root/deploy-activemanagement.sh, so this is what runs.
          script: /root/deploy-activemanagement.sh
